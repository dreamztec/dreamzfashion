name: Verify LIVE checkout gateway
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/checkout-readiness-smoke.yml"
jobs:
  paystack-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate public safe checkout readiness (no money movement)
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' 'https://dreamzfashion.dreamz-gc.com/api/paystack-health')"
          printf '%s\n' "$result" | jq '{gateway,ready,code,onlineEnabled,liveCredentialsConfigured,callbackOriginMatches}'
          printf '%s\n' "$result" | jq -e '.ready == true'
