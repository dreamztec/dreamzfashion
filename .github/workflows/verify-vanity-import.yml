name: Verify Vanity Flex order import
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vanity-import.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify tracked items, manual deposit and 25 percent progress
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' 'https://dreamzfashion.dreamz-gc.com/api/vanity-import-health')"
          printf '%s\n' "$result" | jq '{ready}'
          printf '%s\n' "$result" | jq -e '.ready == true'
      - name: Verify private tracking route is published
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -o /dev/null 'https://dreamzfashion.dreamz-gc.com/track/DFK-VF-261110-01'
