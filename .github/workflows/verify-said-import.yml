name: Verify Said's two-sample private tracking
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-said-import.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm two sample lines, offline deposit and 98 percent progress
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' 'https://dreamzfashion.dreamz-gc.com/api/said-import-health')"
          printf '%s\n' "$result" | jq '{ready}'
          printf '%s\n' "$result" | jq -e '.ready == true'
      - name: Confirm tracking page responds without exposing the secret link
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -o /dev/null 'https://dreamzfashion.dreamz-gc.com/track/DFK-SAID-161126'
