name: Verify Braimoh order import
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-braimoh-import.yml"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm eight tracked order lines and recorded payment
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl --fail --silent --show-error --max-time 20 -H 'Cache-Control: no-cache' 'https://dreamzfashion.dreamz-gc.com/api/braimoh-import-health')"
          printf '%s\n' "$result" | jq '{ready}'
          printf '%s\n' "$result" | jq -e '.ready == true'
      - name: Confirm customer tracking page responds without publishing private link
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 -o /dev/null 'https://dreamzfashion.dreamz-gc.com/track/DFK-BRA-261112-VIII'
