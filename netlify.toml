[build]
  command = "npm test && npm run build"
  publish = "dist/client"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888

# Public-domain / Creative Commons leather-reference imagery is proxied through
# Netlify Image CDN so the Studio stays same-origin and mobile-optimized.
[images]
  remote_images = ['https://commons\.wikimedia\.org/.*', 'https://upload\.wikimedia\.org/.*']

# Fingerprinted Vite bundles are immutable across deployments.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-cache static image assets shipped with a versioned deploy.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Public storefront HTML: short shared caching removes repeated database-backed
# SSR latency while keeping admin/product changes reasonably fresh. Browser
# caching is unchanged; these directives are Netlify-CDN-only.
[[headers]]
  for = "/"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, max-age=300, stale-while-revalidate=1800"
    Netlify-Vary = "query=preview"

[[headers]]
  for = "/product/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, max-age=120, stale-while-revalidate=600"

[[headers]]
  for = "/shop/*"
  [headers.values]
    Netlify-CDN-Cache-Control = "public, durable, max-age=120, stale-while-revalidate=600"

# Baseline security headers for every response.
# CSP notes: the app loads no third-party scripts, fonts or stylesheets
# (fonts are self-hosted via Fontsource, imagery goes through the same-origin
# Netlify Image CDN, Paystack checkout is a full redirect — not an iframe).
# 'unsafe-inline' stays for script/style because TanStack Start ships
# hydration data as inline scripts and React emits inline style attributes.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Robots-Tag = "index, follow"
